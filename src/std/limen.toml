# The capabilities each standard library module may take. The compiler checks
# the modules against this like any dependency's caps (E0320), so a std
# module cannot quietly start taking a capability. A module missing from
# this list may take none.
[package]
name = "std"

[dependencies]
json = { path = ".", caps = [] }
list = { path = ".", caps = [] }
text = { path = ".", caps = [] }
http = { path = ".", caps = ["net", "listen"] }
format = { path = ".", caps = [] }
time = { path = ".", caps = ["clock", "fs"] }
regex = { path = ".", caps = [] }
sql = { path = ".", caps = ["fs", "foreign=sqlite3"] }
errors = { path = ".", caps = [] }
hex = { path = ".", caps = [] }
base64 = { path = ".", caps = [] }
hash = { path = ".", caps = [] }
csv = { path = ".", caps = [] }
url = { path = ".", caps = [] }
flags = { path = ".", caps = [] }
log = { path = ".", caps = ["stdout", "stderr", "clock"] }
path = { path = ".", caps = ["fs"] }
uuid = { path = ".", caps = ["rand", "clock"] }
compress = { path = ".", caps = [] }

# Modules whose foreign blocks are part of the standard library's trusted
# base: their C calls need no Foreign capability, so a program using them
# only grants what the module's own functions take (sql: an Fs).
[trust]
foreign = ["sql"]
