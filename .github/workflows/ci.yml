# Build and test Limen on real machines: x86-64 and arm64 Linux, and macOS
# on Apple silicon. The same checks as before any change (see
# ROADMAP.md), plus short fuzz runs of the HTTP server and JSON.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # no Intel macOS: those runners are being retired (see ROADMAP.md, 0.9)
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        ocaml: ["5.3"]
        exclude:
          - os: macos-15
            ocaml: "5.3"
        include:
          # 5.3 dies at exit on macos-15 ("Failed to reset signal stack (err
          # 22)") after every test has passed; 5.5 is what development uses
          - os: macos-15
            ocaml: "5.5"
    runs-on: ${{ matrix.os }}
    # each step has its own limit, so a hang fails in minutes; this is the sum
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config clang

      # The runners' kernels randomise mmap with 32 bits, which ASan and TSan
      # can't map around: every sanitized binary crashes at start without this.
      - name: Sanitizer address space (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}

      - name: Dune
        run: opam install -y dune

      - name: Build
        run: opam exec -- dune build --root .

      - name: Compiler tests
        timeout-minutes: 60
        run: opam exec -- dune exec --root . ./test/test_limen.exe

      - name: Runtest
        timeout-minutes: 15
        run: opam exec -- dune build --root . @runtest

      - name: Grammar suite
        timeout-minutes: 15
        run: opam exec -- bash grammar/check-suite.sh

      - name: Self-hosted compiler check
        timeout-minutes: 30
        run: DUNE_ROOT=$PWD LIMEN_BOOK=none opam exec -- sh selfhost/check.sh

      - name: Bootstrap
        timeout-minutes: 30
        run: DUNE_ROOT=$PWD opam exec -- sh selfhost/bootstrap.sh

      - name: Fuzz JSON and the HTTP server
        timeout-minutes: 15
        run: |
          L=./_build/default/bin/main.exe
          $L build fuzz/json.lmn -o fj
          ./fj --seed ${{ github.run_number }} -- 300000 | tee fj.log
          grep -q ", 0 problems" fj.log
          $L build fuzz/http.lmn -o fh
          ./fh --grant listen=127.0.0.1:0 --grant net=127.0.0.1 --seed ${{ github.run_number }} -- 10000 | tee fh.log
          grep -q ", 0 problems" fh.log

      - name: Fuzz the front end and the readers of outside data
        timeout-minutes: 20
        run: |
          L=./_build/default/bin/main.exe
          $L build fuzz/formats.lmn -o ff
          ./ff --seed ${{ github.run_number }} -- 200000 | tee ff.log
          grep -q ", 0 problems" ff.log
          $L build fuzz/regexes.lmn -o fr
          ./fr --seed ${{ github.run_number }} -- 3000 | tee fr.log
          grep -q ", 0 problems" fr.log
          $L build fuzz/inflate.lmn -o fi
          ./fi --grant fs=test/zoneinfo:ro --seed ${{ github.run_number }} -- 20000 | tee fi.log
          grep -q ", 0 problems" fi.log
          $L build fuzz/ws/frames.lmn -o fw
          ./fw --grant listen=127.0.0.1:0 --grant net=127.0.0.1 --seed ${{ github.run_number }} -- 2000 | tee fw.log
          grep -q ", 0 problems" fw.log
          $L build selfhost/limen.lmn -o tsc
          ./_build/default/fuzz/front/fuzz_front.exe --seed ${{ github.run_number }} --count 2000 --selfhost $PWD/tsc --exact $PWD/$L \
            examples selfhost/tests fuzz src/std bench | tee fz.log
          grep -q ", 0 problems" fz.log
