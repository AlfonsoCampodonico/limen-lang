# The custom resource that examples/site_operator.vela serves.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: staticsites.vela.dev
spec:
  group: vela.dev
  scope: Namespaced
  names:
    kind: StaticSite
    plural: staticsites
    singular: staticsite
    shortNames: [site]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Replicas, type: integer, jsonPath: .spec.replicas }
        - { name: Ready, type: integer, jsonPath: .status.readyReplicas }
        - { name: Status, type: string, jsonPath: .status.message }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [html]
              properties:
                html: { type: string }
                replicas: { type: integer, default: 1 }
            status:
              type: object
              properties:
                readyReplicas: { type: integer }
                url: { type: string }
                message: { type: string }
